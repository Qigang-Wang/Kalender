<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalender 提醒</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: "Segoe UI Variable", "Segoe UI", system-ui, sans-serif;
        --surface: rgba(249,251,255,.98); --text: #172033; --muted: #68748a;
        --line: rgba(38,61,96,.16); --accent: #2864bd; --soft: #e9f1ff; --success: #238346;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --surface: rgba(31,35,44,.98); --text: #f3f6fb; --muted: #aab4c5;
          --line: rgba(255,255,255,.16); --accent: #a8ccff; --soft: #293e5c; --success: #66d68c;
        }
      }
      * { box-sizing: border-box; }
      [hidden] { display: none !important; }
      html, body { width: 100%; margin: 0; overflow: hidden; background: transparent; }
      body { padding: 10px; }
      main { padding: 16px; color: var(--text); background: var(--surface); border: 1px solid var(--line); border-radius: 18px; }
      /* No outer shadow: the native window would clip it into a rectangular halo. */
      header { display: flex; align-items: center; gap: 9px; height: 28px; }
      .logo { display: grid; place-items: center; width: 28px; height: 28px; flex: none; border-radius: 8px; background: #5187d4; color: white; }
      .brand { font-size: 13px; font-weight: 650; }
      .countdown { margin-left: auto; padding: 4px 8px; border-radius: 20px; background: var(--soft); color: var(--accent); font-size: 11px; font-weight: 650; white-space: nowrap; }
      button { font: inherit; cursor: pointer; }
      .close { margin-left: auto; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 8px; background: transparent; color: var(--muted); font-size: 22px; }
      .countdown:not([hidden]) + .close { margin-left: 0; }
      .close:hover { background: var(--soft); color: var(--text); }
      h1 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; margin: 14px 0 10px; font-size: 20px; font-weight: 650; line-height: 1.3; overflow-wrap: anywhere; }
      .details { display: grid; gap: 8px; font-size: 13px; color: var(--muted); }
      .detail-row { display: flex; align-items: center; gap: 9px; min-width: 0; line-height: 20px; }
      .detail-row span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
      #time { color: var(--text); }
      .success { display: none; }
      .test-content { min-width: 0; }
      .is-test .content { display: flex; align-items: center; gap: 13px; margin-top: 18px; }
      .is-test .success { display: block; width: 35px; height: 35px; color: var(--success); }
      .is-test h1 { margin: 0 0 5px; font-size: 18px; }
      .is-test #time { color: var(--muted); }
      footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }
      .action { min-height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line); font-size: 13px; }
      .secondary { background: transparent; color: var(--text); }
      .primary { background: #286bc4; color: white; border-color: transparent; }
      button:hover { filter: brightness(1.08); }
      button:disabled { cursor: wait; opacity: .6; }
      button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .queue-count { border-top: 1px solid var(--line); margin-top: 12px; padding-top: 10px; color: var(--muted); font-size: 12px; }
      .error { margin: 10px 0 0; color: var(--accent); font-size: 12px; overflow-wrap: anywhere; }
    </style>
  </head>
  <body>
    <main id="card" role="alertdialog" aria-labelledby="title" aria-describedby="details">
      <header>
        <span class="logo" aria-hidden="true">✦</span><span class="brand">Kalender</span>
        <span id="countdown" class="countdown"></span>
        <button id="close" class="close" type="button" aria-label="关闭当前提醒">×</button>
      </header>
      <div class="content">
        <svg class="success" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m7 12 3 3 7-7"/></svg>
        <div class="test-content">
          <h1 id="title"></h1>
          <div id="details" class="details">
            <div class="detail-row"><svg id="clock" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="time"></span></div>
            <div id="location" class="detail-row" hidden><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M20 10c0 6-8 11-8 11S4 16 4 10a8 8 0 1 1 16 0Z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="location-text"></span></div>
          </div>
        </div>
      </div>
      <p id="error" class="error" role="status" hidden></p>
      <footer><button id="snooze" class="action secondary" type="button">稍后 10 分钟</button><button id="open" class="action primary" type="button">打开日程 →</button></footer>
      <div id="queue-count" class="queue-count" hidden></div>
    </main>
    <script>
      const invoke = window.__TAURI__.core.invoke;
      const $ = (id) => document.getElementById(id);
      const card = $("card");
      const queue = [];
      let current;
      let busy = false;
      const key = (item) => `${item.id}:${item.startAt}`;
      const isTest = (item) => item.id === "kalender-test-notification";
      function reportError(error) {
        $("error").textContent = String(error);
        $("error").hidden = false;
      }
      function add(items) {
        const known = new Set([current, ...queue].filter(Boolean).map(key));
        for (const item of Array.isArray(items) ? items : []) {
          if (item && !known.has(key(item))) { known.add(key(item)); queue.push(item); }
        }
        if (!current) showNext();
        else updateCount();
      }
      function updateCount() {
        $("queue-count").textContent = `另有 ${queue.length} 项提醒`;
        $("queue-count").hidden = queue.length === 0;
      }
      function updateTime() {
        if (!current || isTest(current)) return;
        const now = new Date();
        const start = new Date(current.startAt);
        const minutes = Math.ceil((start - now) / 60000);
        $("countdown").textContent = current.allDay ? "全天日程" : minutes <= 0 ? "已到开始时间" : minutes < 60 ? `${minutes} 分钟后开始` : minutes < 1440 ? `${Math.floor(minutes / 60)} 小时后开始` : `${Math.floor(minutes / 1440)} 天后开始`;
        const date = start.toDateString() === now.toDateString() ? "今天" : new Intl.DateTimeFormat("zh-CN", { year: "numeric", month: "numeric", day: "numeric" }).format(start);
        $("time").textContent = current.allDay ? `${date} · 全天` : `${date} ${new Intl.DateTimeFormat("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false }).format(start)}`;
      }
      function showNext() {
        current = queue.shift();
        updateCount();
        if (!current) { void invoke("close_reminder").catch(reportError); return; }
        const test = isTest(current);
        card.classList.toggle("is-test", test);
        $("title").textContent = test ? "测试通知已送达" : current.title;
        $("title").title = $("title").textContent;
        $("countdown").hidden = test;
        $("clock").toggleAttribute("hidden", test);
        $("location").hidden = test || !current.location;
        $("location-text").textContent = current.location || "";
        $("location-text").title = current.location || "";
        $("snooze").hidden = !current.canSnooze;
        $("open").textContent = test ? "知道了" : "打开日程 →";
        $("error").hidden = true;
        if (test) $("time").textContent = current.message || "桌面提醒已正常连接。";
        else updateTime();
      }
      async function act(action) {
        if (!current || busy) return;
        busy = true;
        const buttons = [...document.querySelectorAll("button")];
        buttons.forEach((button) => button.disabled = true);
        try {
          if (action === "snooze") await invoke("snooze_reminder", { id: current.id, startAt: current.startAt });
          if (action === "open" && !isTest(current)) await invoke("open_reminder", { route: current.route });
          showNext();
        } catch (error) { reportError(error); }
        finally { busy = false; buttons.forEach((button) => button.disabled = false); }
      }
      $("close").addEventListener("click", () => void act("close"));
      $("open").addEventListener("click", () => void act("open"));
      $("snooze").addEventListener("click", () => void act("snooze"));
      // Only refresh the displayed time; reminders never expire automatically.
      window.setInterval(updateTime, 15000);
      let previousHeight = 0;
      new ResizeObserver(() => {
        const height = Math.ceil(card.getBoundingClientRect().height) + 20;
        if (height === previousHeight) return;
        previousHeight = height;
        void invoke("resize_reminder", { height }).catch(reportError);
      }).observe(card);
      window.addEventListener("kalender:reminders", (event) => add(event.detail));
      add(window.__KALENDER_REMINDERS__ || []);
    </script>
  </body>
</html>
