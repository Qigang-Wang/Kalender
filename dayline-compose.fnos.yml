name: dayline

# 部署前只需修改这里。此文件包含明文密码，填写后不要提交到公开仓库。
x-dayline-settings:
  database-password: &database-password "CHANGE_ME_DATABASE_PASSWORD"
  qgw-auth-secret: &qgw-auth-secret "CHANGE_ME_TO_A_LONG_RANDOM_SECRET"
  backup-directory: &backup-directory "/vol3/1000/Docker_App/Dayline/backups"
  timezone: &timezone "Europe/Berlin"
  # 加入 NAS 的局域网 IP 和反向代理域名；浏览器 MCP 客户端还需填写完整 Origin。
  mcp-allowed-hosts: &mcp-allowed-hosts "localhost,127.0.0.1,::1,CHANGE_ME_DAYLINE_HOST"
  mcp-allowed-origins: &mcp-allowed-origins ""

services:
  dayline:
    build:
      context: https://github.com/Qigang-Wang/Kalender.git#main
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8812:3000"
    environment:
      NODE_ENV: production
      TZ: *timezone
      QGW_AUTH_SECRET: *qgw-auth-secret
      DATABASE_URL: postgresql://kalender@postgres:5432/kalender
      PGPASSWORD: *database-password
      KALENDER_DATA_DIR: /app/.data
      KALENDER_BACKUP_DIR: /app/.backups
      KALENDER_BACKUP_MAX_BYTES: "536870912"
      KALENDER_SYNC_INTERVAL_MS: "180000"
      KALENDER_CALENDAR_SYNC_INTERVAL_MS: "180000"
      KALENDER_JOB_POLL_INTERVAL_MS: "5000"
      KALENDER_AI_AUTO_EXECUTION: "false"
      KALENDER_MCP_TOKEN_REQUESTS_PER_MINUTE: "120"
      KALENDER_MCP_INVALID_TOKEN_REQUESTS_PER_MINUTE: "20"
      KALENDER_MCP_TRUST_PROXY_IP_HEADERS: "false"
      KALENDER_MCP_ALLOWED_HOSTS: *mcp-allowed-hosts
      KALENDER_MCP_ALLOWED_ORIGINS: *mcp-allowed-origins
      KALENDER_MAIL_BODY_CACHE_MAX_AGE_DAYS: "30"
      KALENDER_MAIL_BODY_CACHE_MAX_MB: "128"
    volumes:
      - kalender-data:/app/.data
      - type: bind
        source: *backup-directory
        target: /app/.backups
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    stop_grace_period: 30s

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      TZ: *timezone
      POSTGRES_DB: kalender
      POSTGRES_USER: kalender
      POSTGRES_PASSWORD: *database-password
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalender -d kalender"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    stop_grace_period: 60s

volumes:
  kalender-data:
    name: kalender-data
  postgres-data:
    name: kalender-postgres-data
