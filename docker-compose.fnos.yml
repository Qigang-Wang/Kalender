name: kalender

services:
  kalender:
    build:
      context: https://github.com/Qigang-Wang/Kalender.git#main
    image: kalender:local
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${KALENDER_HTTP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      TZ: ${TZ:-Europe/Berlin}
      DATABASE_URL: postgresql://kalender:${KALENDER_POSTGRES_PASSWORD:?请在.env中设置数据库密码}@postgres:5432/kalender
      KALENDER_DATA_DIR: /app/.data
      KALENDER_BACKUP_DIR: /app/.backups
      KALENDER_MASTER_KEY: ${KALENDER_MASTER_KEY:?请在.env中设置固定的Base64主密钥}
      KALENDER_BACKUP_PASSWORD: ${KALENDER_BACKUP_PASSWORD:-}
      KALENDER_BACKUP_MAX_BYTES: "${KALENDER_BACKUP_MAX_BYTES:-536870912}"
      KALENDER_SYNC_INTERVAL_MS: "${KALENDER_SYNC_INTERVAL_MS:-180000}"
      KALENDER_CALENDAR_SYNC_INTERVAL_MS: "${KALENDER_CALENDAR_SYNC_INTERVAL_MS:-180000}"
      KALENDER_JOB_POLL_INTERVAL_MS: "${KALENDER_JOB_POLL_INTERVAL_MS:-5000}"
      KALENDER_AI_AUTO_EXECUTION: "${KALENDER_AI_AUTO_EXECUTION:-false}"
      KALENDER_MAIL_BODY_CACHE_MAX_AGE_DAYS: "${KALENDER_MAIL_BODY_CACHE_MAX_AGE_DAYS:-30}"
      KALENDER_MAIL_BODY_CACHE_MAX_MB: "${KALENDER_MAIL_BODY_CACHE_MAX_MB:-128}"
    volumes:
      - kalender-data:/app/.data
      - kalender-backups:/app/.backups
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    stop_grace_period: 30s

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Berlin}
      POSTGRES_DB: kalender
      POSTGRES_USER: kalender
      POSTGRES_PASSWORD: ${KALENDER_POSTGRES_PASSWORD:?请在.env中设置数据库密码}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalender -d kalender"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    stop_grace_period: 60s

volumes:
  kalender-data:
    name: kalender-data
  kalender-backups:
    name: kalender-backups
  postgres-data:
    name: kalender-postgres-data
