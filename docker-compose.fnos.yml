name: kalender

services:
  kalender:
    build:
      context: https://github.com/Qigang-Wang/Kalender.git#main
    image: kalender:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kalender:${KALENDER_POSTGRES_PASSWORD:?请设置数据库密码}@postgres:5432/kalender
      KALENDER_DATA_DIR: /app/.data
      KALENDER_BACKUP_DIR: /app/.backups
      KALENDER_MASTER_KEY: ${KALENDER_MASTER_KEY:?请设置固定的Base64主密钥}
      KALENDER_BACKUP_PASSWORD: ${KALENDER_BACKUP_PASSWORD:-}
      KALENDER_SYNC_INTERVAL_MS: "180000"
      KALENDER_CALENDAR_SYNC_INTERVAL_MS: "180000"
      KALENDER_JOB_POLL_INTERVAL_MS: "5000"
      KALENDER_AI_AUTO_EXECUTION: "false"
      KALENDER_MAIL_BODY_CACHE_MAX_AGE_DAYS: "30"
      KALENDER_MAIL_BODY_CACHE_MAX_MB: "128"
    volumes:
      - kalender-data:/app/.data
      - kalender-backups:/app/.backups
    logging:
      options:
        max-size: "20m"
        max-file: "3"

  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: kalender
      POSTGRES_USER: kalender
      POSTGRES_PASSWORD: ${KALENDER_POSTGRES_PASSWORD:?请设置数据库密码}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kalender -d kalender"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql
    logging:
      options:
        max-size: "20m"
        max-file: "3"

volumes:
  kalender-data:
    name: kalender-data
  kalender-backups:
    name: kalender-backups
  postgres-data:
    name: kalender-postgres-data
