<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日期时间选择器示意</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eef3f8;
      --panel: #ffffff;
      --line: #d7e0ea;
      --line-strong: #c5d2df;
      --text: #26333f;
      --muted: #7a8997;
      --blue: #4f8ed8;
      --blue-dark: #3977c2;
      --blue-soft: #e9f2ff;
      --shadow: 0 18px 48px rgba(48, 66, 84, .16);
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      color: var(--text);
      background: linear-gradient(135deg, #f7fbff, var(--bg));
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    .stage {
      display: grid;
      gap: 16px;
    }

    .picker {
      display: grid;
      grid-template-columns: 312px 218px;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      box-shadow: var(--shadow);
    }

    .calendar-pane {
      padding: 16px;
      border-right: 1px solid var(--line);
    }

    .picker-header {
      display: grid;
      grid-template-columns: 34px 1fr 34px;
      align-items: center;
      gap: 8px;
      min-height: 36px;
      margin-bottom: 12px;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    .icon-button {
      display: grid;
      width: 34px;
      height: 34px;
      padding: 0;
      color: #435261;
      background: transparent;
      border: 0;
      border-radius: 9px;
      place-items: center;
    }

    .icon-button:hover {
      background: #f0f5fa;
    }

    .level-button {
      min-width: 0;
      height: 34px;
      padding: 0 12px;
      color: var(--text);
      background: transparent;
      border: 0;
      border-radius: 9px;
      font-weight: 700;
    }

    .level-button:hover {
      background: #f0f5fa;
    }

    .weekdays,
    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }

    .weekdays {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .day,
    .month,
    .year {
      min-width: 0;
      height: 34px;
      color: var(--text);
      background: transparent;
      border: 1px solid transparent;
      border-radius: 9px;
      font-size: 13px;
    }

    .day:hover,
    .month:hover,
    .year:hover {
      background: #f1f6fb;
      border-color: #dce6ef;
    }

    .outside {
      color: #9ca9b4;
    }

    .selected {
      color: #fff;
      background: var(--blue);
      border-color: var(--blue);
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(79, 142, 216, .28);
    }

    .month-grid,
    .year-grid {
      display: grid;
      gap: 10px;
    }

    .month-grid {
      grid-template-columns: repeat(3, 1fr);
    }

    .year-grid {
      grid-template-columns: repeat(4, 1fr);
    }

    .month,
    .year {
      height: 48px;
    }

    .time-pane {
      display: grid;
      grid-template-rows: auto auto auto;
      gap: 14px;
      padding: 16px;
      background: #f8fbfe;
    }

    .time-pane header {
      display: grid;
      gap: 4px;
    }

    .time-pane small {
      color: var(--muted);
      font-size: 12px;
    }

    .time-pane strong {
      color: var(--text);
      font-size: 16px;
    }

    .wheel-wrap {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 18px 1fr;
      align-items: center;
      gap: 8px;
      min-height: 168px;
      padding: 10px 0;
    }

    .wheel-wrap::before {
      content: "";
      position: absolute;
      right: 0;
      left: 0;
      top: 50%;
      height: 42px;
      transform: translateY(-50%);
      background: var(--blue-soft);
      border: 1px solid #cfe1f7;
      border-radius: 12px;
      pointer-events: none;
    }

    .colon {
      position: relative;
      z-index: 1;
      color: #8b9aa8;
      font-weight: 800;
      text-align: center;
    }

    .wheel {
      position: relative;
      z-index: 1;
      height: 150px;
      overflow-y: auto;
      padding: 54px 0;
      border-radius: 12px;
      scroll-snap-type: y mandatory;
      scrollbar-width: none;
      mask-image: linear-gradient(to bottom, transparent, black 28%, black 72%, transparent);
    }

    .wheel::-webkit-scrollbar {
      display: none;
    }

    .wheel button {
      display: block;
      width: 100%;
      height: 42px;
      padding: 0;
      color: #71808e;
      background: transparent;
      border: 0;
      border-radius: 10px;
      scroll-snap-align: center;
      font-size: 15px;
      font-weight: 650;
    }

    .wheel button.active {
      color: var(--blue-dark);
      font-size: 18px;
      font-weight: 850;
    }

    .time-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .time-actions button,
    .done {
      height: 36px;
      border-radius: 9px;
      font-size: 13px;
    }

    .time-actions button {
      color: #42515f;
      background: #fff;
      border: 1px solid var(--line-strong);
    }

    .done {
      justify-self: end;
      min-width: 86px;
      color: #fff;
      background: var(--blue);
      border: 1px solid var(--blue);
      font-weight: 800;
    }

    .notes {
      max-width: 530px;
      margin: 0;
      color: #607080;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main class="stage">
    <section class="picker" aria-label="日期时间选择器示意">
      <div class="calendar-pane">
        <div class="picker-header">
          <button class="icon-button" id="prev" type="button" aria-label="上一个">‹</button>
          <button class="level-button" id="level" type="button">2026年08月</button>
          <button class="icon-button" id="next" type="button" aria-label="下一个">›</button>
        </div>
        <div id="calendarBody"></div>
      </div>
      <aside class="time-pane">
        <header>
          <small>时间</small>
          <strong id="summary">2026-08-03 17:20</strong>
        </header>
        <div class="wheel-wrap" aria-label="滑动选择时间">
          <div class="wheel" id="hourWheel" aria-label="小时"></div>
          <span class="colon">:</span>
          <div class="wheel" id="minuteWheel" aria-label="分钟"></div>
        </div>
        <div class="time-actions">
          <button id="today" type="button">↺ 今天</button>
          <button id="clear" type="button">× 清除</button>
        </div>
        <button class="done" type="button">✓ 完成</button>
      </aside>
    </section>
    <p class="notes">交互草图：点击顶部月份进入“月份选择”，标题变成年份；再点击年份进入“年份选择”。右侧时间不再用下拉和快捷按钮堆叠，而是两个可滚动的小时/分钟滑轮。</p>
  </main>

  <script>
    const state = {
      level: "day",
      year: 2026,
      month: 7,
      day: 3,
      hour: 17,
      minute: 20
    };

    const body = document.getElementById("calendarBody");
    const levelButton = document.getElementById("level");
    const summary = document.getElementById("summary");
    const hourWheel = document.getElementById("hourWheel");
    const minuteWheel = document.getElementById("minuteWheel");

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateSummary() {
      summary.textContent = `${state.year}-${pad(state.month + 1)}-${pad(state.day)} ${pad(state.hour)}:${pad(state.minute)}`;
    }

    function render() {
      updateSummary();
      if (state.level === "day") renderDays();
      if (state.level === "month") renderMonths();
      if (state.level === "year") renderYears();
    }

    function renderDays() {
      levelButton.textContent = `${state.year}年${pad(state.month + 1)}月`;
      const first = new Date(state.year, state.month, 1);
      const startOffset = first.getDay() === 0 ? 6 : first.getDay() - 1;
      const start = new Date(state.year, state.month, 1 - startOffset);
      const names = ["一", "二", "三", "四", "五", "六", "日"];
      body.innerHTML = `<div class="weekdays">${names.map((name) => `<span>${name}</span>`).join("")}</div><div class="days"></div>`;
      const days = body.querySelector(".days");
      for (let index = 0; index < 42; index += 1) {
        const date = new Date(start);
        date.setDate(start.getDate() + index);
        const button = document.createElement("button");
        button.type = "button";
        button.className = "day";
        if (date.getMonth() !== state.month) button.classList.add("outside");
        if (date.getFullYear() === state.year && date.getMonth() === state.month && date.getDate() === state.day) button.classList.add("selected");
        button.textContent = String(date.getDate());
        button.onclick = () => {
          state.year = date.getFullYear();
          state.month = date.getMonth();
          state.day = date.getDate();
          render();
        };
        days.append(button);
      }
    }

    function renderMonths() {
      levelButton.textContent = `${state.year}年`;
      const monthNames = ["一月", "二月", "三月", "四月", "五月", "六月", "七月", "八月", "九月", "十月", "十一月", "十二月"];
      body.innerHTML = `<div class="month-grid"></div>`;
      const grid = body.querySelector(".month-grid");
      monthNames.forEach((name, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "month";
        if (index === state.month) button.classList.add("selected");
        button.textContent = name;
        button.onclick = () => {
          state.month = index;
          state.level = "day";
          render();
        };
        grid.append(button);
      });
    }

    function renderYears() {
      const start = Math.floor(state.year / 12) * 12;
      levelButton.textContent = `${start}-${start + 11}`;
      body.innerHTML = `<div class="year-grid"></div>`;
      const grid = body.querySelector(".year-grid");
      for (let year = start; year < start + 12; year += 1) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "year";
        if (year === state.year) button.classList.add("selected");
        button.textContent = String(year);
        button.onclick = () => {
          state.year = year;
          state.level = "month";
          render();
        };
        grid.append(button);
      }
    }

    function renderWheel(container, max, current, onPick) {
      container.innerHTML = "";
      for (let value = 0; value <= max; value += 1) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = pad(value);
        if (value === current) button.classList.add("active");
        button.onclick = () => {
          onPick(value);
          renderWheels();
          updateSummary();
        };
        container.append(button);
      }
      requestAnimationFrame(() => {
        const active = container.querySelector(".active");
        active?.scrollIntoView({ block: "center" });
      });
    }

    function renderWheels() {
      renderWheel(hourWheel, 23, state.hour, (value) => state.hour = value);
      renderWheel(minuteWheel, 59, state.minute, (value) => state.minute = value);
    }

    levelButton.onclick = () => {
      state.level = state.level === "day" ? "month" : state.level === "month" ? "year" : "year";
      render();
    };

    document.getElementById("prev").onclick = () => {
      if (state.level === "day") state.month -= 1;
      else if (state.level === "month") state.year -= 1;
      else state.year -= 12;
      if (state.month < 0) {
        state.month = 11;
        state.year -= 1;
      }
      render();
    };

    document.getElementById("next").onclick = () => {
      if (state.level === "day") state.month += 1;
      else if (state.level === "month") state.year += 1;
      else state.year += 12;
      if (state.month > 11) {
        state.month = 0;
        state.year += 1;
      }
      render();
    };

    document.getElementById("today").onclick = () => {
      const today = new Date();
      state.year = today.getFullYear();
      state.month = today.getMonth();
      state.day = today.getDate();
      state.level = "day";
      render();
    };

    document.getElementById("clear").onclick = () => {
      summary.textContent = "未选择时间";
    };

    renderWheels();
    render();
  </script>
</body>
</html>
