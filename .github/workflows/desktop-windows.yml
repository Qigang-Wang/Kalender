name: Desktop Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build-windows:
    name: Check Windows client and build releases
    runs-on: windows-latest
    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
          cargo --version

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate updater signing key
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $signingProbe = Join-Path $env:RUNNER_TEMP "kalender-signing-check.txt"
          Set-Content -Path $signingProbe -Value "Kalender signing check" -NoNewline
          try {
            npx --no-install tauri signer sign "--password=$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" $signingProbe
            if ($LASTEXITCODE -ne 0) {
              throw "Updater signing check failed. TAURI_SIGNING_PRIVATE_KEY must contain the complete kalender.key file, not kalender.key.pub or pubkey. Verify its password if one was set."
            }
          } finally {
            Remove-Item $signingProbe, "$signingProbe.sig" -ErrorAction SilentlyContinue
          }

      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $config = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $expectedTag = "v$($config.version)"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag $env:GITHUB_REF_NAME does not match Tauri version $expectedTag"
          }

      - name: Type-check application
        run: npm run typecheck

      - name: Test desktop calendar reminders
        run: npm run test:desktop-reminders

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Lint desktop client
        # Match Tauri packaging so main seeds release dependencies for tagged builds.
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --release --features tauri/custom-protocol --all-targets -- -D warnings

      - name: Test desktop client
        run: cargo test --manifest-path src-tauri/Cargo.toml --release --features tauri/custom-protocol

      - name: Build Windows installers
        if: github.event_name == 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/v')
        run: npm run desktop:build

      - name: Build signed Windows update
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run desktop:build:updater

      - name: Create updater manifest
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $installer = Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not generated" }
          $signaturePath = "$($installer.FullName).sig"
          if (-not (Test-Path $signaturePath)) { throw "Updater signature was not generated" }
          $signature = (Get-Content $signaturePath -Raw).Trim()
          $encodedName = [Uri]::EscapeDataString($installer.Name)
          $manifest = @{
            version = $env:GITHUB_REF_NAME.TrimStart('v')
            notes = "Kalender $env:GITHUB_REF_NAME"
            pub_date = (Get-Date).ToUniversalTime().ToString("o")
            platforms = @{
              "windows-x86_64" = @{
                signature = $signature
                url = "https://github.com/Qigang-Wang/Kalender/releases/download/$env:GITHUB_REF_NAME/$encodedName"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content "src-tauri/target/release/bundle/latest.json" -Encoding utf8

      - name: Upload workflow artifacts
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: kalender-windows-${{ github.sha }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.exe.sig
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/msi/*.msi.sig
            src-tauri/target/release/bundle/latest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Windows installers
        uses: actions/download-artifact@v4
        with:
          name: kalender-windows-${{ github.sha }}
          path: release-assets

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s globstar nullglob
          files=(release-assets/**/*.exe release-assets/**/*.exe.sig release-assets/**/*.msi release-assets/**/*.msi.sig release-assets/**/latest.json)
          if (( ${#files[@]} == 0 )); then
            echo "No Windows installers were generated" >&2
            exit 1
          fi

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" \
              --title "Kalender $GITHUB_REF_NAME" \
              --generate-notes
          fi
